services:

  db:
    image: postgres:18
    container_name: pg-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be defined. Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined. Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be defined. Copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be defined. Copy .env.example to .env}:5432"

volumes:
  pgdata:  
